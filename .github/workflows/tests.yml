name: Tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest fl_risk_model/tests -q
      - run: python scripts/demo/run_demo.py --n_iter 10 --seed 42
